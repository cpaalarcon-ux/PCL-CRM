name: Staging browser UAT

on:
  push:
    branches:
      - backend/staging-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-uat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run automated regression suite
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser UAT
        run: npm run test:browser
